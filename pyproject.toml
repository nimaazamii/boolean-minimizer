[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boolean-minimizer"
version = "0.1.0"
description = "Boolean expression parser with Quine-McCluskey and Petrick minimisation, exact minimal sum-of-products and Karnaugh-map rendering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nima Azami" }]
dependencies = []
keywords = ["digital-logic", "quine-mccluskey", "boolean-algebra", "karnaugh-map"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
